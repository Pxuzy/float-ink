name: Build FloatInk APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLOATINK_RELEASE_CERT_SHA256: dedc79e5a562d940fcd4ef520783e9a7752d1d4e593c5cdd829728c3633ce035

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remote repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/float-ink-release.jks"
          chmod 600 "$RUNNER_TEMP/float-ink-release.jks"

      - name: Build and test
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/float-ink-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "float-ink-${GITHUB_REF_NAME#v}.apk"

      - name: Verify APK integrity
        run: |
          APK="float-ink-${GITHUB_REF_NAME#v}.apk"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          test -x "$APKSIGNER"
          printf '%s\n' '=== SHA-256 ===' && sha256sum "$APK"
          printf '%s\n' '=== unzip integrity ===' && unzip -t "$APK"
          printf '%s\n' '=== apksigner verify ===' && "$APKSIGNER" verify --verbose "$APK"
          CERT_OUTPUT="$($APKSIGNER verify --print-certs "$APK" 2>&1)"
          printf '%s\n' "$CERT_OUTPUT"
          ACTUAL_CERT="$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d '\r')"
          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$FLOATINK_RELEASE_CERT_SHA256"

      - name: Verify APK metadata
        run: |
          APK="float-ink-${GITHUB_REF_NAME#v}.apk"
          KEYTOOL="$(dirname "$(readlink -f "$(which java)")")/keytool"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS_DIR/aapt"
          test -x "$AAPT"
          VERSION="${GITHUB_REF_NAME#v}"
          printf '%s\n' '=== aapt metadata ==='
          "$AAPT" dump badging "$APK" | grep -E 'package:|versionCode|versionName|application-label'
          printf '%s\n' '=== signature cert SHA-256 ==='
          printf '%s\n' "$FLOATINK_RELEASE_CERT_SHA256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: float-ink-*.apk
