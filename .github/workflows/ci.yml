name: CI — Build and Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Debug build
        run: ./gradlew :app:assembleDebug

      - name: Lint vital Release
        run: ./gradlew lintVitalRelease

      - name: Check diff
        run: git diff --check